{{define "healthcheck"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Healthcheck</h1>
    <table style="width:1150px; margin:auto">
        <tr>
            <th>service</th>
            <th>status</th>
            <th>environment</th>
        </tr>
        {{range $key, $value := .}}
            <tr>
                <td>{{$key}}</td>
                <td>{{$value.Status}}</td>
                <td>{{$value.Environment}}</td>
            </tr>
        {{end}}
    </table>
</body>
</html>
{{end}}
